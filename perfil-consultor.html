<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Perfil do(a) Consultor(a) — Eagler Gym</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
  --or:#D91E18;--or-t:#A80F0A;--or-d:rgba(217,30,24,0.10);--or-m:rgba(217,30,24,0.22);
  --bg:#F8F6F6;--s1:#ffffff;--s2:#F1EDED;--s3:#E8E1E1;
  --bd:rgba(26,26,26,0.10);--bdo:rgba(217,30,24,0.30);
  --tx:#1A1A1A;--tm:rgba(26,26,26,0.68);--td:rgba(26,26,26,.64);
  --gr:#16a34a;--gr-d:rgba(22,163,74,0.10);
  --re:#dc2626;--re-d:rgba(220,38,38,0.10);
  --am:#d97706;--am-d:rgba(217,119,6,0.10);
  --pu:#9333ea;--bl:#2563eb;
}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--tx)}
  h1,h2,h3{font-family:'Barlow Condensed'}
  header{background:var(--s1);padding:16px 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--bd)}
  header a{color:var(--tm);text-decoration:none;font-size:13px}
  .logo{font-family:'Barlow Condensed';font-weight:800;font-size:18px;color:var(--or-t)}
  main{max-width:820px;margin:0 auto;padding:30px 20px 60px}
  .card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:22px;margin-bottom:18px}
  .card h3{font-size:16px;font-weight:600;margin-bottom:14px}
  .sub{font-size:12px;color:var(--td);margin-top:-8px;margin-bottom:16px}
  .fg{margin-bottom:14px}
  .fl{font-size:11.5px;font-weight:600;color:var(--tm);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .fi{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:7px;background:var(--s2);color:var(--tx);font-family:'Barlow';font-size:13.5px}
  .row{display:grid;gap:12px}
  .row3{grid-template-columns:1fr 1fr 1fr}
  .row2{grid-template-columns:1fr 1fr}
  .btn{background:var(--or);color:#fff;border:none;border-radius:7px;padding:9px 16px;font-family:'Barlow Condensed';font-weight:700;font-size:13px;cursor:pointer}
  .btn-gh{background:transparent;border:1px solid var(--bd);color:var(--tm);border-radius:7px;padding:8px 14px;font-family:'Barlow';font-size:12.5px;cursor:pointer}
  .item{padding:10px 0;border-bottom:1px solid var(--bd);font-size:13px}
  .item:last-child{border-bottom:none}
  .item .meta{font-size:11px;color:var(--td);margin-top:3px}
  .badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;text-transform:uppercase}
  .badge.pendente{background:rgba(245,158,11,.15);color:var(--am)}
  .badge.em_andamento{background:rgba(217,30,24,.15);color:var(--or-t)}
  .badge.concluido{background:rgba(34,197,94,.15);color:var(--gr)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--td);font-size:10.5px;text-transform:uppercase;padding:0 8px 8px;border-bottom:1px solid var(--bd)}
  td{padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
  .locked{text-align:center;color:var(--td);padding:60px 20px}
</style>
<style id="marca-css">
.brand-img{display:block;height:44px;width:auto}
.brand-img.big{height:96px;margin:0 auto 8px}
.gf-foot{display:flex;align-items:center;justify-content:center;gap:7px;padding:18px 0 14px;font-size:10.5px;color:#556182;letter-spacing:.3px}
.gf-foot img{height:15px;width:auto;opacity:.85}
.auth-box .gf-foot{padding:16px 0 0}
.auth-screen.active~.gf-foot,#loginScreen:not([style*="none"])~.gf-foot{display:none}
.app.show~.gf-foot{margin-left:210px}
</style><style id="tema-eagler">
.brand-img{background:#111;padding:5px 9px;border-radius:9px;box-sizing:content-box}
.topbar .brand-img,header .brand-img,.logo .brand-img{background:none;padding:0;height:38px;border-radius:0}
.brand-img.big{height:92px;padding:12px 20px;border-radius:14px}
.btn-or,.btn-primary,button.btn-or{color:#fff!important}

header{background:#111!important;border-bottom:2px solid #D91E18!important}
header a{color:rgba(255,255,255,.85)!important}
header .logo{color:#FF5A52!important}
header div,header span{color:rgba(255,255,255,.85)!important}
header .logo{color:#FF5A52!important}
.btn-or,.btn-primary,button.btn-or{color:#fff!important}.user-chip,.topbar .user-chip{color:#FF5A52!important}</style></head>

    <div style="font-size:13px;color:var(--tm)">Perfil do(a) Consultor(a)</div>
  </header>

  <main id="app">
    <div class="locked">Carregando...</div>
  </main>

<script>
  const SB_URL='https://irwvagffrguiljaxrzmd.supabase.co';
  const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlyd3ZhZ2Zmcmd1aWxqYXhyem1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNDk5ODUsImV4cCI6MjEwNDkyNTk4NX0.YAApyaH6iIHEua_89fgCUpMzgXRIcWb_vNRkBQAoq5A';
  const H={apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json'};
  async function sbGet(t,p=''){const r=await fetch(`${SB_URL}/rest/v1/${t}?${p}`,{headers:{...H,'Prefer':''}});if(!r.ok)throw new Error(await r.text());return r.json()}
  async function sbPost(t,b){const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:H,body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json()}
  async function sbUpsert(t,b){const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:{...H,'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json()}

  const params=new URLSearchParams(location.search);
  const uid=params.get('uid'), consultoraId=params.get('id');
  let viewer=null, consultora=null, canEdit=false, canView=false;

  function uidGen(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
  function fmtR$(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function fmtData(d){return d?new Date(d+'T00:00:00').toLocaleDateString('pt-BR'):'—';}
  function trimestreAtual(){const m=new Date().getMonth();const t=Math.floor(m/3)+1;return `${new Date().getFullYear()}-Q${t}`;}

  async function init(){
    const app=document.getElementById('app');
    if(!uid||!consultoraId){app.innerHTML='<div class="locked">Link inválido — acesse pela aba Equipe do sistema.</div>';return;}
    try{
      const [viewers,conss]=await Promise.all([
        sbGet('eagler_gestores',`id=eq.${uid}`),
        sbGet('eagler_consultoras',`id=eq.${consultoraId}`)
      ]);
      viewer=viewers[0]; consultora=conss[0];
    }catch(e){console.error(e);}
    if(!viewer||!consultora){app.innerHTML='<div class="locked">Não foi possível carregar. Volte e tente de novo.</div>';return;}
    canEdit=viewer.role==='gestor'||viewer.role==='admin';
    canView=canEdit||(viewer.role==='consultor'&&viewer.consultora_id===consultoraId);
    if(!canView){app.innerHTML='<div class="locked">🔒 Você não tem acesso a este perfil.</div>';return;}
    render();
  }

  function render(){
    const app=document.getElementById('app');
    const tipoLbl={planos:'Nº Planos',rs:'R$ Valor',treino:'Treinamento'};
    app.innerHTML=`
      <div class="card">
        <h2 style="font-size:22px">${consultora.nome}</h2>
        <div class="sub">Consultor(a) de Vendas · desde ${fmtData((consultora.criado_em||'').slice(0,10))} · meta atual: ${tipoLbl[consultora.meta_tipo]||'—'} ${consultora.meta_tipo==='rs'?fmtR$(consultora.meta):consultora.meta||''}</div>
      </div>

      <div class="card">
        <h3>🎯 Metas por período</h3>
        <div class="sub">Histórico de metas definidas para cada mês ou campanha.</div>
        <div id="metas-lista"></div>
        ${canEdit?`
        <div class="row row3" style="margin-top:16px">
          <div class="fg"><label class="fl">Início do período</label><input class="fi" type="date" id="mp-inicio"></div>
          <div class="fg"><label class="fl">Fim (opcional)</label><input class="fi" type="date" id="mp-fim"></div>
          <div class="fg"><label class="fl">Tipo</label>
            <select class="fi" id="mp-tipo"><option value="planos">Nº Planos</option><option value="rs">R$ Valor</option><option value="treino">Treinamento</option></select>
          </div>
        </div>
        <div class="fg"><label class="fl">Valor da meta</label><input class="fi" type="number" id="mp-valor"></div>
        <button class="btn" onclick="addMetaPeriodo()">Adicionar período</button>`:''}
      </div>

      <div class="card">
        <h3>📊 KPIs mensais</h3>
        <div class="sub">Matrículas e valor vendido puxados automático dos lançamentos diários.</div>
        <table><thead><tr><th>Mês</th><th>Matrículas</th><th>Vendido</th><th>Observação</th></tr></thead><tbody id="kpis-tbody"></tbody></table>
      </div>

      <div class="card">
        <h3>🗣️ Registros de 1:1</h3>
        <div id="a1a-lista"></div>
        ${canEdit?`
        <div class="row row2" style="margin-top:14px">
          <div class="fg"><label class="fl">Data</label><input class="fi" type="date" id="a1a-data"></div>
        </div>
        <div class="fg"><label class="fl">Anotação</label><input class="fi" id="a1a-desc" placeholder="O que foi conversado..."></div>
        <button class="btn" onclick="add1a1()">Adicionar registro</button>`:''}
      </div>

      <div class="card">
        <h3>📋 Planos de ação trimestrais</h3>
        <div id="plano-lista"></div>
        ${canEdit?`
        <div class="row row3" style="margin-top:14px">
          <div class="fg"><label class="fl">Trimestre</label><input class="fi" id="pa-trimestre" value="${trimestreAtual()}"></div>
          <div class="fg"><label class="fl">Status</label>
            <select class="fi" id="pa-status"><option value="pendente">Pendente</option><option value="em_andamento">Em andamento</option><option value="concluido">Concluído</option></select>
          </div>
        </div>
        <div class="fg"><label class="fl">Descrição</label><input class="fi" id="pa-desc" placeholder="Demanda ou plano de melhoria..."></div>
        <button class="btn" onclick="addPlanoAcao()">Adicionar plano de ação</button>`:''}
      </div>
    `;
    carregarMetas(); carregarKpis(); carregarRegistros('1a1','a1a-lista'); carregarRegistros('plano_acao','plano-lista');
  }

  async function carregarMetas(){
    const rows=await sbGet('eagler_consultora_metas_periodo',`consultora_id=eq.${consultoraId}&order=periodo_inicio.desc`);
    const tipoLbl={planos:'Nº Planos',rs:'R$ Valor',treino:'Treinamento'};
    const el=document.getElementById('metas-lista');
    if(!rows.length){el.innerHTML='<div class="item" style="color:var(--td)">Nenhum período registrado ainda.</div>';return;}
    el.innerHTML=rows.map(r=>`<div class="item">${fmtData(r.periodo_inicio)} ${r.periodo_fim?'– '+fmtData(r.periodo_fim):'(em aberto)'}
      <div class="meta">${tipoLbl[r.meta_tipo]||'—'}: ${r.meta_tipo==='rs'?fmtR$(r.meta_valor):r.meta_valor}</div></div>`).join('');
  }
  async function addMetaPeriodo(){
    const inicio=document.getElementById('mp-inicio').value;
    if(!inicio)return alert('Informe o início do período.');
    await sbPost('eagler_consultora_metas_periodo',{
      academia_id:consultora.academia_id, consultora_id:consultoraId,
      periodo_inicio:inicio, periodo_fim:document.getElementById('mp-fim').value||null,
      meta_tipo:document.getElementById('mp-tipo').value, meta_valor:parseFloat(document.getElementById('mp-valor').value)||null,
      criado_em:Date.now()
    });
    carregarMetas();
  }

  async function carregarKpis(){
    const regs=await sbGet('eagler_registros',`consultora_id=eq.${consultoraId}&order=data.desc`);
    const kpisSalvos=await sbGet('eagler_consultor_kpis_mensais',`consultora_id=eq.${consultoraId}`);
    const obsMap={}; kpisSalvos.forEach(k=>obsMap[k.mes_referencia.slice(0,7)]=k.observacao||'');
    const porMes={};
    regs.forEach(r=>{
      const m=r.data.slice(0,7);
      if(!porMes[m])porMes[m]={matriculas:0,vendido:0};
      if(r.funis){
        Object.values(r.funis).forEach(fd=>{porMes[m].matriculas+=(fd.convertidos||0);porMes[m].vendido+=(fd.vendido||0);});
      }
    });
    const meses=Object.keys(porMes).sort().reverse().slice(0,6);
    const tbody=document.getElementById('kpis-tbody');
    if(!meses.length){tbody.innerHTML='<tr><td colspan="4" style="color:var(--td)">Sem lançamentos ainda.</td></tr>';return;}
    tbody.innerHTML=meses.map(m=>{
      const d=porMes[m];
      const editable=canEdit?`<input class="fi" style="font-size:12px;padding:5px 7px" value="${(obsMap[m]||'').replace(/"/g,'&quot;')}" onchange="salvarObsKpi('${m}',this.value)">`:(obsMap[m]||'—');
      return `<tr><td>${m}</td><td>${d.matriculas}</td><td>${fmtR$(d.vendido)}</td><td>${editable}</td></tr>`;
    }).join('');
  }
  async function salvarObsKpi(mes,valor){
    await sbUpsert('eagler_consultor_kpis_mensais',{academia_id:consultora.academia_id,consultora_id:consultoraId,mes_referencia:mes+'-01',observacao:valor,updated_at:Date.now()});
  }

  async function carregarRegistros(tipo,elId){
    const rows=await sbGet('eagler_consultor_registros',`consultora_id=eq.${consultoraId}&tipo=eq.${tipo}&order=data.desc`);
    const el=document.getElementById(elId);
    if(!rows.length){el.innerHTML='<div class="item" style="color:var(--td)">Nenhum registro ainda.</div>';return;}
    el.innerHTML=rows.map(r=>`<div class="item">
      ${tipo==='plano_acao'?`<b>${r.trimestre}</b> <span class="badge ${r.status}">${({pendente:'Pendente',em_andamento:'Em andamento',concluido:'Concluído'})[r.status]||r.status}</span>`:fmtData(r.data)}
      <div class="meta">${r.descricao||''}</div>
    </div>`).join('');
  }
  async function add1a1(){
    const data=document.getElementById('a1a-data').value;
    const desc=document.getElementById('a1a-desc').value.trim();
    if(!data||!desc)return alert('Preencha data e anotação.');
    await sbPost('eagler_consultor_registros',{academia_id:consultora.academia_id,consultora_id:consultoraId,tipo:'1a1',data,descricao:desc,criado_por:uid,criado_em:Date.now()});
    document.getElementById('a1a-desc').value='';
    carregarRegistros('1a1','a1a-lista');
  }
  async function addPlanoAcao(){
    const desc=document.getElementById('pa-desc').value.trim();
    if(!desc)return alert('Descreva o plano de ação.');
    await sbPost('eagler_consultor_registros',{
      academia_id:consultora.academia_id,consultora_id:consultoraId,tipo:'plano_acao',
      data:new Date().toISOString().slice(0,10),trimestre:document.getElementById('pa-trimestre').value,
      descricao:desc,status:document.getElementById('pa-status').value,criado_por:uid,criado_em:Date.now()
    });
    document.getElementById('pa-desc').value='';
    carregarRegistros('plano_acao','plano-lista');
  }

  init();
</script>
